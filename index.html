<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>MRS App Store - Official IPTV Network</title>
    <meta name="description" content="Download verified M R S IPTV Android and M R S IPTV TV APKs directly with SHA-256 verification, real user reviews, and inbuilt developer app publishing." />
    <meta property="og:title" content="MRS App Store - Official IPTV Network" />
    <meta property="og:description" content="Download verified M R S IPTV Android and M R S IPTV TV APKs directly with SHA-256 verification, real user reviews, and inbuilt developer app publishing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MRS App Store - Official IPTV Network" />
    <meta name="twitter:description" content="Download verified M R S IPTV Android and M R S IPTV TV APKs directly with SHA-256 verification, real user reviews, and inbuilt developer app publishing." />
    <link rel="icon" type="image/jpeg" href="./assets/site-logo-icon.jpg" />
    <link rel="apple-touch-icon" href="./assets/site-logo.jpg" />
    <meta property="og:image" content="./assets/site-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var path = window.location.pathname || '/';
        if (path !== '/' && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body style="background:#000;color:#f4f4f5;margin:0;" class="bg-black text-zinc-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div id="mrs-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center;">
        <div style="max-width:480px;width:100%;background:#111115;border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:28px;">
          <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;">MRS App Store</div>
          <div id="mrs-boot-status" style="font-size:13px;color:#a1a1aa;line-height:1.6;">Loading store catalog...</div>
          <noscript>
            <div style="margin-top:12px;font-size:13px;color:#fca5a5;">JavaScript is required to run MRS App Store.</div>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var hasViteClient = !!document.querySelector('script[src*="/@vite/client"]');
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        if (!hasViteClient && rawEntry) {
          window.__MRS_GH_ROOT_MODE__ = true;
          if (rawEntry.parentNode) rawEntry.parentNode.removeChild(rawEntry);

          var iconLink = document.querySelector('link[rel="icon"]');
          if (iconLink) iconLink.setAttribute('href', './public/assets/site-logo-icon.jpg');
          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) appleIcon.setAttribute('href', './public/assets/site-logo.jpg');
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', './public/assets/site-logo.jpg');

          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './gh-pages/app.css';
          document.head.appendChild(css);

          var appScript = document.createElement('script');
          appScript.type = 'module';
          appScript.src = './gh-pages/app.js';
          document.body.appendChild(appScript);
        }

        var bootErrors = [];
        window.addEventListener(
          'error',
          function (ev) {
            if (ev && ev.message) {
              bootErrors.push(ev.message);
            } else if (ev && ev.target && (ev.target.src || ev.target.href)) {
              var assetUrl = ev.target.src || ev.target.href || '';
              if (window.__MRS_GH_ROOT_MODE__ && assetUrl.indexOf('/src/main.tsx') !== -1) {
                return;
              }
              bootErrors.push('Failed to load ' + assetUrl);
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (ev) {
          if (ev && ev.reason) bootErrors.push(ev.reason.message || String(ev.reason));
        });

        setTimeout(function () {
          if (window.__MRS_APP_MOUNTED__) return;
          var statusEl = document.getElementById('mrs-boot-status');
          if (!statusEl) return;
          var msg = 'Unable to initialize MRS App Store. Please reload this page.';
          if (bootErrors.length > 0) {
            msg += ' (' + bootErrors[0] + ')';
          }
          statusEl.textContent = msg;
          statusEl.style.color = '#fca5a5';
        }, 5000);
      })();
    </script>
  </body>
</html>
