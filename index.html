  <body style="background:#000;color:#f4f4f5;margin:0;" class="bg-black text-zinc-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div id="mrs-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center;">
        <div style="max-width:460px;width:100%;background:#111115;border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:28px;">
          <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;">MRS App Store</div>
          <div id="mrs-boot-status" style="font-size:13px;color:#a1a1aa;line-height:1.6;">Loading store catalog...</div>
          <noscript>
            <div style="margin-top:12px;font-size:13px;color:#fca5a5;">JavaScript is required to run MRS App Store.</div>
          </noscript>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var bootErrors = [];
        window.addEventListener('error', function (ev) {
          if (ev && ev.message) bootErrors.push(ev.message);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          if (ev && ev.reason) bootErrors.push(ev.reason.message || String(ev.reason));
        });
        setTimeout(function () {
          if (window.__MRS_APP_MOUNTED__) return;
          var statusEl = document.getElementById('mrs-boot-status');
          if (!statusEl) return;
          var isGh = /github\.io$/i.test(window.location.hostname || '');
          var msg = isGh
            ? 'The application bundle did not load on GitHub Pages. In your GitHub repository, open Settings → Pages → Build and deployment → Source and select "GitHub Actions" so the built dist/ bundle is deployed.'
            : 'Unable to initialize the frontend script bundle. Please rebuild the application or reload this page.';
          if (bootErrors.length > 0) {
            msg += ' (' + bootErrors[0] + ')';
          }
          statusEl.textContent = msg;
          statusEl.style.color = '#fca5a5';
        }, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
